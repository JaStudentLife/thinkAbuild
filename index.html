<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>thinkAbuild</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar"></header>
      <aside id="left"></aside>
      <main id="view">
        <div id="canvas-host"></div>
        <div id="verdict" class="verdict hidden"></div>
        <div id="viewbar"></div>
        <div id="simhud" class="hidden"></div>
        <div id="legend" class="hidden"></div>
        <div id="splash">
          <div class="splash-card">
            <div class="splash-logo">think<span>A</span>build</div>
            <div class="splash-sub">Loading the physics engine&hellip;</div>
          </div>
        </div>
      </main>
      <aside id="right"></aside>
      <footer id="status"></footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
